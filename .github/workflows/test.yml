name: Offline interface tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-v1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run contract and state-machine tests
        run: python -X utf8 selftest.py
      - name: Validate committed synthetic example
        run: python -X utf8 radar_offline.py validate DEMO_ONLY/release_demo/20261103_PDEMO_S01_lifecycle_01 --stage c
