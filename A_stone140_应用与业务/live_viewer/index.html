<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>座位监测</title>
  <link rel="stylesheet" href="/live.css">
  <script src="/live.js" defer></script>
</head>
<body>
  <header><div><h1>座位监测</h1><p id="source">正在连接 A 端服务</p></div><span id="connection" role="status">连接中</span></header>
  <main>
    <section class="overview" aria-label="座位概览">
      <div class="panel seat" id="seatPanel">
        <div class="caption" id="seat">座位</div>
        <strong id="occupancy">待确认</strong>
        <p id="availability">等待数据</p>
      </div>
      <div class="panel metrics">
        <div><span class="caption">坐姿</span><b id="posture">—</b></div>
        <div><span class="caption">姿态提醒</span><b id="reminder">—</b></div>
        <div><span class="caption">释放剩余</span><b id="remaining">—</b></div>
        <div><span class="caption">最近一帧</span><b id="frame">—</b></div>
      </div>
    </section>
    <section class="panel history">
      <h2>最近事件</h2>
      <p id="eventEmpty">等待事件</p>
      <ol id="events"></ol>
    </section>
  </main>
  <footer>A 端实时入口 v0.1.1 · 本机运行</footer>
</body>
</html>
